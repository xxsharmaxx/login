<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Modern responsive login template"
    >

    <title>Secure Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #080b14;
            --card: rgba(17, 22, 38, 0.88);
            --border: rgba(255, 255, 255, 0.10);
            --text: #f5f7ff;
            --muted: #9299ad;
            --accent: #6c63ff;
            --accent-dark: #5148e5;
            --danger: #ff5c7a;
            --success: #38d996;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text);
            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(108, 99, 255, 0.20),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(0, 212, 255, 0.13),
                    transparent 30%
                ),
                var(--bg);

            padding: 24px;
            overflow-x: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .orb {
            position: absolute;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            animation: float 8s ease-in-out infinite;
        }

        .orb-one {
            background: #6c63ff;
            top: -100px;
            left: -100px;
        }

        .orb-two {
            background: #00d4ff;
            right: -100px;
            bottom: -100px;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, -25px);
            }
        }

        .login-container {
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;

            margin: 0 auto 18px;

            display: grid;
            place-items: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    #00bcd4
                );

            font-size: 26px;

            box-shadow:
                0 12px 30px rgba(108, 99, 255, 0.35);
        }

        .brand h1 {
            font-size: 28px;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .brand p {
            color: var(--muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 600;
            color: #dce0ec;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: #70788d;
            pointer-events: none;
        }

        .form-input {
            width: 100%;

            padding: 14px 46px;

            border: 1px solid var(--border);
            border-radius: 12px;

            outline: none;

            background: rgba(255, 255, 255, 0.045);
            color: var(--text);

            font-size: 14px;

            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                background 0.2s;
        }

        .form-input::placeholder {
            color: #666e82;
        }

        .form-input:focus {
            border-color: var(--accent);

            background: rgba(255, 255, 255, 0.065);

            box-shadow:
                0 0 0 4px rgba(108, 99, 255, 0.12);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            border: none;
            background: transparent;

            color: #7b8295;

            cursor: pointer;
            font-size: 17px;
        }

        .password-toggle:hover {
            color: white;
        }

        .password-strength {
            height: 4px;

            margin-top: 9px;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.08);

            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;

            border-radius: inherit;

            transition:
                width 0.3s,
                background 0.3s;
        }

        .strength-text {
            display: block;

            margin-top: 6px;

            font-size: 11px;
            color: var(--muted);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin: 8px 0 24px;

            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;

            color: var(--muted);
            cursor: pointer;
        }

        .remember input {
            accent-color: var(--accent);
        }

        .forgot {
            color: #8e87ff;
            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 12px;

            color: white;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    #00a9d6
                );

            box-shadow:
                0 12px 25px rgba(108, 99, 255, 0.25);

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                opacity 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 16px 30px rgba(108, 99, 255, 0.35);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;

            margin: 26px 0;

            color: #666e82;

            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .signup {
            text-align: center;

            color: var(--muted);

            font-size: 13px;
        }

        .signup a {
            color: #938cff;
            font-weight: 600;
            text-decoration: none;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        .message {
            display: none;

            padding: 11px 13px;
            margin-bottom: 18px;

            border-radius: 10px;

            font-size: 12px;
        }

        .message.error {
            display: block;

            color: #ff9db0;
            background: rgba(255, 92, 122, 0.10);
            border: 1px solid rgba(255, 92, 122, 0.20);
        }

        .message.success {
            display: block;

            color: #72e8b4;
            background: rgba(56, 217, 150, 0.10);
            border: 1px solid rgba(56, 217, 150, 0.20);
        }

        .spinner {
            display: none;

            width: 16px;
            height: 16px;

            margin: auto;

            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: white;

            border-radius: 50%;

            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 22px;
                border-radius: 20px;
            }

            .brand h1 {
                font-size: 24px;
            }

            .form-options {
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<div class="background">
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
</div>

<main class="login-container">

    <section class="login-card">

        <div class="brand">

            <div class="brand-icon">
                🔐
            </div>

            <h1>Welcome Back</h1>

            <p>Sign in to continue to your account</p>

        </div>

        <div id="message" class="message"></div>

        <form id="loginForm" novalidate>

            <!-- Email -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="email"
                >
                    Email Address
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        ✉
                    </span>

                    <input
                        class="form-input"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <!-- Password -->

            <div class="form-group">

                <label
                    class="form-label"
                    for="password"
                >
                    Password
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        class="form-input"
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

                <div class="password-strength">
                    <div
                        class="strength-bar"
                        id="strengthBar"
                    ></div>
                </div>

                <span
                    class="strength-text"
                    id="strengthText"
                >
                    Enter your password
                </span>

            </div>


            <!-- Options -->

            <div class="form-options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    Remember me

                </label>

                <a
                    href="#"
                    class="forgot"
                    onclick="forgotPassword(event)"
                >
                    Forgot password?
                </a>

            </div>


            <!-- Login -->

            <button
                class="login-btn"
                id="loginButton"
                type="submit"
            >

                <span id="buttonText">
                    Sign In
                </span>

                <span
                    class="spinner"
                    id="spinner"
                ></span>

            </button>

        </form>


        <div class="divider">
            OR
        </div>


        <div class="signup">

            Don't have an account?

            <a href="#">
                Create account
            </a>

        </div>

    </section>

</main>


<script>

    const form = document.getElementById("loginForm");

    const email = document.getElementById("email");

    const password = document.getElementById("password");

    const togglePassword =
        document.getElementById("togglePassword");

    const strengthBar =
        document.getElementById("strengthBar");

    const strengthText =
        document.getElementById("strengthText");

    const message =
        document.getElementById("message");

    const loginButton =
        document.getElementById("loginButton");

    const buttonText =
        document.getElementById("buttonText");

    const spinner =
        document.getElementById("spinner");


    // Password visibility

    togglePassword.addEventListener(
        "click",
        () => {

            const visible =
                password.type === "text";

            password.type =
                visible ? "password" : "text";

            togglePassword.textContent =
                visible ? "👁" : "🙈";

            togglePassword.setAttribute(
                "aria-label",
                visible
                    ? "Show password"
                    : "Hide password"
            );
        }
    );


    // Password strength

    password.addEventListener(
        "input",
        () => {

            const value = password.value;

            let score = 0;

            if (value.length >= 8)
                score++;

            if (/[A-Z]/.test(value))
                score++;

            if (/[a-z]/.test(value))
                score++;

            if (/[0-9]/.test(value))
                score++;

            if (/[^A-Za-z0-9]/.test(value))
                score++;

            const levels = [
                ["0%", "none"],
                ["20%", "Very Weak"],
                ["40%", "Weak"],
                ["60%", "Medium"],
                ["80%", "Strong"],
                ["100%", "Very Strong"]
            ];

            strengthBar.style.width =
                levels[score][0];

            strengthText.textContent =
                value
                    ? `Password strength: ${levels[score][1]}`
                    : "Enter your password";
        }
    );


    // Form submission

    form.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();

            message.className = "message";
            message.textContent = "";

            const emailValue =
                email.value.trim();

            const passwordValue =
                password.value;

            if (!emailValue) {

                showError(
                    "Please enter your email address."
                );

                email.focus();
                return;
            }

            if (!email.checkValidity()) {

                showError(
                    "Please enter a valid email address."
                );

                email.focus();
                return;
            }

            if (!passwordValue) {

                showError(
                    "Please enter your password."
                );

                password.focus();
                return;
            }

            if (passwordValue.length < 8) {

                showError(
                    "Password must contain at least 8 characters."
                );

                password.focus();
                return;
            }


            // Loading state

            loginButton.disabled = true;

            buttonText.style.display = "none";
            spinner.style.display = "block";


            // Demo request

            await new Promise(
                resolve =>
                    setTimeout(resolve, 1500)
            );


            loginButton.disabled = false;

            buttonText.style.display = "inline";
            spinner.style.display = "none";


            showSuccess(
                "Login validation successful! Connect this form to your backend API."
            );
        }
    );


    function showError(text) {

        message.className =
            "message error";

        message.textContent = text;
    }


    function showSuccess(text) {

        message.className =
            "message success";

        message.textContent = text;
    }


    function forgotPassword(event) {

        event.preventDefault();

        showSuccess(
            "Password recovery would start here."
        );
    }

</script>

</body>
</html>
